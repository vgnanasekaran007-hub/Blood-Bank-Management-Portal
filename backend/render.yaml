services:
  - type: web
    name: blood-bank-portal-backend
    env: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && python seed_data.py"
    startCommand: "gunicorn bloodportal.wsgi:application --bind 0.0.0.0:$PORT"
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,*.vercel.app,localhost,127.0.0.1"
      - key: DATABASE_URL
        sync: false
